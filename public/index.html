<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366F1">
  <link rel="manifest" href="/manifest.json">
  <title>One Touch</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div id="splash" class="screen active">
      <div class="splash-content">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <h1>One Touch</h1>
        </div>
        <p>حوّل أي فيديو لشورت بضغطة واحدة</p>
        <button class="btn-primary" onclick="showScreen('home')">ابدأ الآن</button>
      </div>
    </div>

    <div id="home" class="screen">
      <div class="container">
        <div class="header">
          <h2>🎬 أنشئ شورت</h2>
          <p>الصق لينك يوتيوب</p>
        </div>
        <div class="input-group">
          <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." class="input-field">
        </div>
        <button class="btn-primary btn-large" onclick="processVideo()">⚡ أنشئ الشورتات</button>
        <div class="features">
          <div class="feature-item"><span>🎯</span><p>اختيار ذكي</p></div>
          <div class="feature-item"><span>📊</span><p>تقييم الانتشار</p></div>
          <div class="feature-item"><span>⚡</span><p>سريع ومجاني</p></div>
        </div>
      </div>
    </div>

    <div id="processing" class="screen">
      <div class="container">
        <div class="processing-content">
          <div class="spinner"></div>
          <h2 id="processingTitle">جاري التحليل...</h2>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
          <p id="processingStep">تحميل الفيديو</p>
        </div>
      </div>
    </div>

    <div id="results" class="screen">
      <div class="container">
        <div class="header">
          <h2>✨ الشورتات الجاهزة</h2>
          <p>اختر الشورت اللي يعجبك</p>
        </div>
        <div id="shortsList" class="shorts-list"></div>
        <button class="btn-secondary" onclick="showScreen('home')">🔄 إنشاء شورت جديد</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
